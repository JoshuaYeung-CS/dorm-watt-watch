[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dormwatt"
version = "0.1.0"
description = "Per-appliance energy estimates from a utility usage CSV, and the swaps that save the most kWh, dollars and CO2e."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Joshua Yeung"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]
factors = ["openpyxl>=3.1"]

[project.scripts]
dormwatt = "dormwatt.cli:main"

[tool.setuptools]
packages = ["dormwatt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
